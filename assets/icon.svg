<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Landscape orientation icon">
  <defs>
    <clipPath id="landscape-frame">
      <rect x="10" y="28" width="108" height="72" rx="8"/>
    </clipPath>
    <clipPath id="mountain-shape">
      <path d="M15 94 38 36 50 69 57 49 72 94Z"/>
    </clipPath>
  </defs>

  <rect x="10" y="28" width="108" height="72" rx="8" fill="none" stroke="#111" stroke-width="2.25"/>

  <g clip-path="url(#landscape-frame)" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <!-- Two sharp, left-weighted peaks whose base stops before the sea. -->
    <path d="M15 94 38 36 50 69 57 49 72 94Z" fill="#111" stroke-width="3"/>
    <g clip-path="url(#mountain-shape)" fill="#fff" stroke="none">
      <path d="M38 36 49 59l-5-1-2.5 5-3-7-3.5 4-2.5-3-5 1Z"/>
      <path d="M57 49 62 68l-5-4-2.5 2-4-7Z"/>
    </g>

    <!-- Small sun over the sea, with rays aligned radially. -->
    <circle cx="91" cy="49" r="5.5" fill="#111" stroke="none"/>
    <g fill="none" stroke-width="2">
      <path d="M91 39v-4"/><path d="M91 63v-4"/>
      <path d="M81 49h-4"/><path d="M105 49h-4"/>
      <path d="m83.9 41.9-2.8-2.8"/><path d="m100.9 58.9-2.8-2.8"/>
      <path d="m98.1 41.9 2.8-2.8"/><path d="m81.1 58.9 2.8-2.8"/>
    </g>

    <!-- Two compact sinusoids, each with three crests and three troughs. -->
    <g fill="none" stroke-width="2.25">
      <path d="M76 84 q3-4 6 0t6 0t6 0t6 0t6 0t6 0"/>
      <path d="M76 93 q3-4 6 0t6 0t6 0t6 0t6 0t6 0"/>
    </g>
  </g>
</svg>
