name: "CI"
on:
  push:
    branches: "*"
  pull_request:
env:
  php-version: 8.3
  node-version: 24.16.0
  npm-version: 11.13.0
  cache-version: 1
jobs:
  platform-check:
    name: "PHP 8.1 compatibility"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.1
          coverage: none

      - name: "Check dependency compatibility"
        run: |
          composer check-platform-reqs --no-dev

  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ env.php-version }}
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v5
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install Composer dependencies"
        run: |
          composer install -n --prefer-dist

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.node-version }}

      - name: "Cache NPM dependencies"
        uses: actions/cache@v5
        with:
          path: "~/.npm"
          key: npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package.json') }}
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Pin npm version"
        run: |
          npm install -g npm@${{ env.npm-version }}

      - name: "Install NPM dependencies"
        run: |
          npm ci

      - name: "Build"
        run: |
          npm run build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          path: dist

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    needs: build
    env:
      php-extensions: ast
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP extension caching"
        id: extcache
        uses: shivammathur/cache-extensions@1.14.6
        with:
          php-version: ${{ env.php-version }}
          extensions: ${{ env.php-extensions }}
          key: php-extensions-${{ runner.os }}-${{ env.cache-version }}

      - name: "Cache extensions"
        uses: actions/cache@v5
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ env.php-version }}
          extensions: ${{ env.php-extensions }}
          coverage: none

      - name: "Cache Composer dependencies"
        uses: actions/cache@v5
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
            composer-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install Composer dependencies"
        run: |
          composer install -n --prefer-dist

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.node-version }}

      - name: "Cache NPM dependencies"
        uses: actions/cache@v5
        with:
          path: "~/.npm"
          key: npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package.json') }}
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Pin npm version"
        run: |
          npm install -g npm@${{ env.npm-version }}

      - name: "Install NPM dependencies"
        run: |
          npm ci

      - name: "Download build artifact"
        uses: actions/download-artifact@v8
        with:
          name: "build-artifact"
          path: dist

      - name: "Lint"
        run: |
          npm run lint

  unit:
    name: "Test"
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        versions: [{php: "8.1", wordpress: "6.5"}, {php: "8.3", wordpress: "latest"}]
    services:
      mysql:
        image: mysql:5
        ports:
          - 3306:3306
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install SVN"
        uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: subversion
          version: ${{ env.cache-version }}

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.versions.php }}
          coverage: pcov

      - name: "Cache Composer dependencies"
        uses: actions/cache@v5
        with:
          path: "~/.composer/cache"
          key: composer-dependencies-test-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-dependencies-test-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('composer.json') }}
            composer-dependencies-test-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Move phpunit to non-dev Composer dependencies"
        run: |
          composer -n require --no-update yoast/phpunit-polyfills:"^2.0" phpunit/phpunit:"^10.5.24"

      - name: "Remove all non-dev Composer dependencies"
        run: |
          composer remove --dev --no-update $(composer show -s | sed -n '/requires (dev)$/,/^$/p' | grep -v 'requires (dev)' | cut -d ' ' -f1 | tr '\n' ' ')

      - name: "Install Composer dependencies"
        run: |
          composer update -n --prefer-dist

      - name: "Setup Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.node-version }}

      - name: "Cache NPM dependencies"
        uses: actions/cache@v5
        with:
          path: "~/.npm"
          key: npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package.json') }}
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Pin npm version"
        run: |
          npm install -g npm@${{ env.npm-version }}

      - name: "Install NPM dependencies"
        run: |
          npm ci

      - name: "Download build artifact"
        uses: actions/download-artifact@v8
        with:
          name: "build-artifact"
          path: dist

      - name: "Prepare WordPress test environment"
        run: |
          ./bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 ${{ matrix.versions.wordpress }}

      - name: "Run tests"
        run: |
          npm run test

      - name: "Upload coverage results"
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  plugin-check:
    name: "Plugin check"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "Download build artifact"
        uses: actions/download-artifact@v8
        with:
          name: "build-artifact"
          path: avpvh-gallery

      - name: "Run plugin check"
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: avpvh-gallery
          ignore-codes: |
            missing_composer_json_file
