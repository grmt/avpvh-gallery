name: "CI"
on:
  push:
    branches: "*"
  pull_request:
jobs:
  platform-check:
    name: "PHP 8.3 compatibility"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Setup PHP"
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: 8.3
          coverage: none

      - name: "Check dependency compatibility"
        run: |
          composer check-platform-reqs --no-dev
