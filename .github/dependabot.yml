# Minor and patch updates come as one PR per ecosystem a week; majors stay
# separate PRs.
version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  groups:
    actions:
      update-types: [minor, patch]
  schedule:
    interval: weekly
  assignees:
    - grmt
- package-ecosystem: npm
  directory: "/"
  groups:
    npm:
      update-types: [minor, patch]
  # eslint-plugin-react 7.37.5 supports ESLint through 9 only.
  # Revisit when its peer dependency includes ESLint 10.
  ignore:
    - dependency-name: eslint
      versions: ["10.x"]
  schedule:
    interval: weekly
  assignees:
    - grmt
- package-ecosystem: composer
  directory: "/"
  groups:
    composer:
      update-types: [minor, patch]
  # php-scoper after 0.18.4 no longer prefixes the Composer autoloader the
  # way the build expects ("Avpvh\Vendor\Composer\Autoload\ClassLoader"
  # not found). Upgrading needs the autoloader patch in config/gulpfile.js adapted.
  ignore:
    - dependency-name: humbug/php-scoper
      versions: [">0.18.4"]
  schedule:
    interval: weekly
  assignees:
    - grmt
