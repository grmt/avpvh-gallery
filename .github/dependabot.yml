version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  assignees:
    - marekdedic
- package-ecosystem: npm
  directory: "/"
  # eslint-plugin-react 7.37.5 supports ESLint through 9 only.
  # Revisit when its peer dependency includes ESLint 10.
  ignore:
    - dependency-name: eslint
      versions: ["10.x"]
  schedule:
    interval: daily
  assignees:
    - marekdedic
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: daily
  assignees:
    - marekdedic
