# Minor and patch updates come as one PR per ecosystem a week; majors stay
# separate PRs.
version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  groups:
    actions:
      update-types: [minor, patch]
  schedule:
    interval: weekly
  assignees:
    - grmt
- package-ecosystem: npm
  directory: "/"
  groups:
    # stylelint and its configs only work in step (a major of one needs the
    # others), so all their updates, majors too, come as one PR. It turns
    # green once every config, @wordpress/stylelint-config included,
    # accepts the new stylelint. Listed first: a package goes to the first
    # group it matches.
    stylelint:
      patterns:
        - "stylelint"
        - "stylelint-*"
        - "@wordpress/stylelint-config"
      update-types: [major, minor, patch]
    npm:
      update-types: [minor, patch]
  # eslint-plugin-react 7.37.5 supports ESLint through 9 only.
  # Revisit when its peer dependency includes ESLint 10.
  ignore:
    - dependency-name: eslint
      versions: ["10.x"]
  schedule:
    interval: weekly
  assignees:
    - grmt
- package-ecosystem: composer
  directory: "/"
  groups:
    composer:
      update-types: [minor, patch]
  schedule:
    interval: weekly
  assignees:
    - grmt
